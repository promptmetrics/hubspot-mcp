[project]
name = "hubspot-mcp"
version = "0.2.0"
description = "Standalone MCP server for HubSpot CRM — tools + write-safety state machine"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Izzy Aly" }]
keywords = ["hubspot", "crm", "mcp", "claude", "automation"]
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic>=2.12,<3",
    "mcp>=2.1.1,<3",
]

[project.urls]
Homepage = "https://github.com/promptmetrics/hubspot-mcp"
Repository = "https://github.com/promptmetrics/hubspot-mcp"

[project.scripts]
hubspot-mcp = "hubspot_mcp.__main__:main"

[project.optional-dependencies]
# Only the hosted deployment needs these; the stdio plugin path must stay a
# three-dependency install.
hosted = [
    "redis>=6,<9",
    "cryptography>=42,<50",
    # RS256/ES256 verification of the authorization server's tokens.
    "pyjwt[crypto]>=2.10,<3",
]
dev = [
    "hubspot-mcp[hosted]",
    "fakeredis>=2.30,<3",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-httpx>=0.36,<0.37",
    "respx>=0.23,<0.24",
    "hypothesis>=6.0,<7",
    "pyyaml>=6.0,<7",
    # Pinned to a minor: a lint gate that changes rule set on a dependency
    # release fails CI on unrelated PRs, which trains people to ignore it.
    "ruff>=0.16.5,<0.17",
    "mypy>=2.3.1,<2.4",
]

# Explicit rather than relying on filename detection, so the entrypoint cannot
# be changed by moving a file.
[tool.vercel]
entrypoint = "app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubspot_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_docs_backend: test drives the docs backend directly (still respx-mocked)",
]
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Deliberate set rather than the default: E/F/I for correctness and import
# order, UP for py312 idioms, B for real bug patterns, S for the security
# checks that matter in a credential-handling server. BLE001 (blind except) is
# enabled because this codebase makes a documented, per-site argument for every
# one it keeps -- audit and teardown failures must never mask a completed write
# -- and those sites already carry `# noqa: BLE001` with the reason.
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "E501",    # line length is handled by the formatter, not the linter
    "S101",    # asserts are the point in tests
    "B008",    # function calls in defaults are used deliberately for pydantic
    # Blind excepts are a documented, load-bearing pattern here, not an
    # oversight: a teardown, audit or snapshot-cleanup failure must never mask
    # a write that already committed, or turn a successful write into an error
    # the caller retries into a duplicate. The sites that matter carry a
    # per-site comment explaining what they are protecting; flagging all ~50
    # would bury that signal in noise.
    "BLE001",
    # try/except/pass and /continue are the same graceful-degradation pattern:
    # an unreachable schema cache or a single bad record must not abort the
    # operation around it.
    "S110",
    "S112",
    # `str, Enum` rather than StrEnum is deliberate -- these values cross the
    # wire through pydantic and the on-disk pending/audit records, and changing
    # the base changes serialization for records already written.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests exercise error paths and construct throwaway credentials.
# S603/S607: the packaging tests shell out to `sh -n` and the allowlist
# script with hardcoded arguments -- there is no untrusted input.
"tests/*" = ["S105", "S106", "S108", "BLE001", "S603", "S607"]
# Agent packages re-export their builders; tool modules import for side effects.
"src/hubspot_mcp/agents/__init__.py" = ["F401"]
"src/hubspot_mcp/tools/__init__.py" = ["F401"]
# URLs, not credentials -- S105 matches on the "token" substring.
"src/hubspot_mcp/app_credentials.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
