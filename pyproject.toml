[project]
name = "hubspot-mcp"
version = "0.1.1"
description = "Standalone MCP server for HubSpot CRM — tools + write-safety state machine"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Izzy Aly" }]
keywords = ["hubspot", "crm", "mcp", "claude", "automation"]
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic>=2.12,<3",
    "mcp>=2.1.1,<3",
]

[project.urls]
Homepage = "https://github.com/promptmetrics/hubspot-mcp"
Repository = "https://github.com/promptmetrics/hubspot-mcp"

[project.scripts]
hubspot-mcp = "hubspot_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-httpx>=0.36,<0.37",
    "respx>=0.23,<0.24",
    "hypothesis>=6.0,<7",
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubspot_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]